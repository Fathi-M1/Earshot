[project]
name = "earshot"
version = "0.1.0"
description = "Private, fully offline listening companion (AppBuildersPH 2026 — Local AI)"
authors = [
    { name = "Fathi", email = "fatximahadpoqor1@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "numpy",
    "sounddevice",
    "faster-whisper",
    "psutil",
    "rapidfuzz>=3.14.6",
    "jellyfish>=1.2.1",
    "pyttsx3>=2.99",
    "dateparser>=1.4.3",
    "segno>=1.6.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "respx",
    "jiwer",
    "icalendar>=7.3.0",
]

[project.scripts]
earshot = "earshot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earshot"]

[tool.pytest.ini_options]
markers = [
    "models: tests that need real models/devices (skipped by default in CI)",
]
addopts = "-m 'not models'"
