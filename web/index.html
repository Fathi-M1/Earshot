<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12241A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>remote</title>
<style>
  @font-face{ font-family:"Host Grotesk"; src:url("/font/host-grotesk.ttf") format("truetype"); font-weight:400 700; font-display:swap; }
  :root{ --forest:#1F3A24; --fd:#12241A; --moss:#3D5A40; --sage:#A9B89C; --beige:#DDE3D3;
    --paper:#EEF1E8; --glow:#7FB3D5; --needs:#C9A45C; --fern:#8FA876; --cap:28px; color-scheme:dark; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overscroll-behavior:none; }
  body{ background:var(--fd); color:var(--beige);
    font-family:"Host Grotesk", ui-sans-serif, system-ui, -apple-system, sans-serif; overflow:hidden; }
  [dir="rtl"],[lang="ar"]{ direction:rtl; text-align:right;
    font-family:"Host Grotesk","Geeza Pro","Noto Naskh Arabic",system-ui,sans-serif; }
  .screen{ display:none; flex-direction:column; height:100vh; height:100dvh; }
  .screen.on{ display:flex; }
  /* start */
  #start{ align-items:center; justify-content:center; gap:16px; padding:28px; text-align:center;
          padding-top:calc(28px + env(safe-area-inset-top)); }
  .mark{ width:56px; height:56px; border-radius:16px; background:var(--forest); display:flex; align-items:center; justify-content:center; }
  .mark .dot{ width:16px; height:16px; border-radius:50%; background:var(--glow); box-shadow:0 0 18px 4px rgba(127,179,213,.6); }
  h1{ font-size:26px; font-weight:600; margin:0; }
  .muted{ color:var(--sage); font-size:15px; line-height:1.45; max-width:320px; }
  button.start{ margin-top:6px; height:54px; padding:0 30px; border-radius:14px; border:0; background:var(--beige); color:var(--fd); font-size:17px; font-weight:600; }
  /* main */
  #main{ padding:0; }
  .top{ flex:0 0 auto; display:flex; align-items:center; gap:10px;
        padding:calc(10px + env(safe-area-inset-top)) 14px 8px; }
  .seg{ flex:1; display:flex; background:var(--forest); border-radius:12px; padding:3px; }
  .seg button{ flex:1; border:0; background:transparent; color:var(--sage); font-size:13px; font-weight:600;
               padding:8px 4px; border-radius:9px; }
  .seg button.on{ background:var(--beige); color:var(--fd); }
  .gear{ width:40px; height:40px; border-radius:11px; border:1px solid rgba(169,184,156,.4); background:transparent; color:var(--beige); font-size:18px; }
  .hint{ flex:0 0 auto; color:var(--sage); font-size:13px; padding:0 16px 6px; }
  .langrow{ flex:0 0 auto; display:flex; flex-direction:column; gap:4px; padding:0 14px 8px; }
  .plabel{ font:400 11px/1 ui-monospace,monospace; text-transform:uppercase; color:var(--sage); margin:6px 0 2px; }
  .seg2{ display:flex; width:100%; background:var(--forest); border-radius:11px; padding:3px; gap:0; }
  .seg2 button{ flex:1 1 0; border:0; background:transparent; color:var(--sage); font-size:14px; font-weight:600; padding:9px 0; border-radius:8px; }
  .seg2 button.on{ background:var(--beige); color:var(--fd); }
  .chip{ border:1px solid rgba(169,184,156,.4); border-radius:9px; padding:7px 11px; font-size:14px; background:transparent; color:var(--beige); }
  .chip.on{ background:var(--moss); border-color:var(--moss); }
  #scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
           display:flex; flex-direction:column; padding:0 16px; position:relative; }
  #stack{ margin-top:auto; display:flex; flex-direction:column; gap:14px; padding:12px 0; }
  #empty{ margin:auto; color:var(--moss); font-size:16px; text-align:center; }
  .line .who{ font:400 11px/1 ui-monospace,monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--sage); margin-bottom:3px; }
  .line.them .who{ color:var(--glow); } .line.me .who{ color:var(--fern); } .line.alert .who{ color:var(--needs); }
  .line .primary{ font-size:var(--cap); line-height:1.16; font-weight:700; color:var(--beige); }
  .line.alert .primary{ color:var(--needs); }
  .line.pending .primary{ opacity:.55; }
  .line .secondary{ font-size:calc(var(--cap) * 0.55); line-height:1.25; color:var(--sage); margin-top:3px; }
  .divider{ text-align:center; color:var(--moss); font:400 11px/1 ui-monospace,monospace; letter-spacing:.15em; text-transform:uppercase; padding:2px 0; }
  .alertcard{ border-left:3px solid var(--needs); padding:6px 0 6px 12px; }
  .alertcard .why{ color:var(--needs); font:400 12px/1.2 ui-monospace,monospace; text-transform:uppercase; }
  #jump{ position:fixed; left:50%; transform:translateX(-50%); bottom:150px; display:none; background:var(--beige); color:var(--fd); border:0; border-radius:980px; padding:8px 16px; font-size:13px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,.3); }
  #jump.on{ display:block; }
  /* bottom */
  .sizerow{ flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:4px 16px; }
  .sizerow .aa{ font-weight:700; color:var(--sage); }
  .sizerow input[type=range]{ flex:1; accent-color:var(--beige); }
  .actions{ flex:0 0 auto; display:flex; gap:10px; padding:8px 14px calc(10px + env(safe-area-inset-bottom)); }
  .act{ flex:1; height:54px; border-radius:13px; border:1px solid rgba(169,184,156,.4); background:transparent; color:var(--beige); font-size:16px; font-weight:600; }
  .act.primary{ background:var(--beige); color:var(--fd); border-color:var(--beige); }
  .act.on{ background:var(--moss); }
  /* settings sheet — solid beige surface, dark forest text */
  #sheet{ position:fixed; inset:0; background:var(--paper); color:var(--fd); display:none; flex-direction:column;
          padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom)); overflow-y:auto; gap:12px; }
  #sheet.on{ display:flex; }
  #sheet h2{ font-size:22px; margin:0; color:var(--fd); }
  #sheet .grp{ font:600 12px/1 ui-monospace,monospace; text-transform:uppercase; letter-spacing:.08em; color:var(--moss); margin:18px 0 2px; }
  #sheet label{ font-size:13px; color:var(--moss); display:block; margin-bottom:4px; }
  #sheet input,#sheet select{ width:100%; height:44px; border-radius:10px; border:1px solid var(--moss); background:#fff; color:var(--fd); padding:0 12px; font-size:15px; }
  #sheet .row{ display:flex; gap:10px; }
  #sheet .doc{ display:flex; justify-content:space-between; align-items:center; padding:12px 2px; border-bottom:1px solid rgba(61,90,64,.2); font-size:16px; color:var(--fd); cursor:pointer; }
  #sheet .doc::after{ content:"›"; color:var(--moss); }
  #sheet .kwchip{ display:inline-flex; align-items:center; gap:6px; background:var(--forest); color:var(--beige); border-radius:999px; padding:6px 10px; font-size:14px; margin:0 6px 6px 0; }
  #sheet .kwchip b{ cursor:pointer; opacity:.7; }
  #sheet button.sav{ background:var(--forest); color:var(--beige); border:0; border-radius:10px; height:44px; font-weight:600; }
  #sheet button.danger{ background:#C47A62; color:#fff; border:0; border-radius:10px; height:44px; font-weight:600; }
  #sheet .ver{ margin-top:auto; color:var(--moss); font:400 11px/1.4 ui-monospace,monospace; padding-top:16px; }
  #docsheet{ position:fixed; inset:0; background:var(--fd); display:none; flex-direction:column; z-index:5; }
  #docsheet.on{ display:flex; }
  #docsheet .bar{ display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 14px 8px; }
  #docsheet iframe{ flex:1; border:0; width:100%; background:var(--fd); }
  #resume{ position:fixed; inset:0; background:rgba(18,36,26,.94); display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
  #resume.on{ display:flex; }
  #resume button{ height:54px; padding:0 28px; border-radius:14px; border:0; background:var(--beige); color:var(--fd); font-size:17px; font-weight:600; }
  .cdot{ width:8px;height:8px;border-radius:50%;background:var(--needs);display:inline-block;margin-right:6px;vertical-align:middle }
  .cdot.live{ background:var(--fern); }
  /* catch-up card */
  #catchCard{ position:fixed; left:14px; right:14px; bottom:calc(74px + env(safe-area-inset-bottom)); display:none;
              background:var(--paper); color:var(--fd); border-radius:16px; padding:14px 16px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  #catchCard.on{ display:block; }
  .cc-head{ display:flex; justify-content:space-between; font:400 11px/1 ui-monospace,monospace; text-transform:uppercase; color:var(--moss); margin-bottom:8px; }
  .cc-head button{ border:0; background:transparent; color:var(--moss); font-size:16px; }
  #ccBody{ font-size:18px; font-weight:600; line-height:1.3; min-height:2.2em; }
  #ccBody .l2{ font-weight:400; color:var(--moss); }
  .sk{ height:16px; background:linear-gradient(90deg,#cdd6c2,#e8ecdf,#cdd6c2); background-size:200% 100%;
       border-radius:6px; margin:6px 0; animation:sh 1.1s infinite; }
  @keyframes sh{ 0%{background-position:200% 0}100%{background-position:-200% 0} }
  .cc-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .cc-foot button{ border:1px solid var(--moss); background:transparent; color:var(--fd); border-radius:10px; padding:8px 14px; font-weight:600; }
</style>
</head>
<body>
  <div id="start" class="screen on">
    <img src="/icon-512.png" alt="Earshot" style="width:84px;height:84px;border-radius:22px">
    <h1 id="brand-start">Earshot</h1>
    <p class="muted">Every word, within earshot.</p>
    <button class="start" id="startBtn">Start</button>
  </div>

  <div id="main" class="screen">
    <div class="top">
      <div class="seg">
        <button data-mode="captions">Captions</button>
        <button data-mode="translate">Translate</button>
        <button data-mode="ambient">Listen for me</button>
      </div>
      <button class="gear" id="gearBtn" aria-label="Settings">⚙</button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="langrow" id="langrow"></div>
    <div id="scroll"><div id="stack"><div id="empty">Listening. Captions appear when someone speaks.</div></div></div>
    <button id="jump">Jump to live ↓</button>
    <div class="sizerow" id="sizerow"><span class="aa" style="font-size:13px">Aa</span>
      <input type="range" id="size" min="18" max="56" step="1" value="28">
      <span class="aa" style="font-size:22px">Aa</span></div>
    <div class="actions">
      <button class="act primary" id="catchBtn">Catch me up</button>
      <button class="act" id="muteBtn">Mute</button>
    </div>
  </div>

  <div id="sheet">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2>Settings</h2><button class="gear" id="closeSheet" style="border-color:var(--moss);color:var(--fd)">✕</button></div>

    <div class="grp">Alerts</div>
    <div><label>Your name</label><input id="setName" placeholder="Fathi"></div>
    <div><label>Keywords</label><div id="kwChips"></div>
      <input id="kwAdd" placeholder="add a keyword, press Enter"></div>

    <div class="grp">Sessions</div>
    <div id="sessList" style="font-size:15px;color:var(--fd)"></div>
    <div class="row"><button class="sav" id="endBtn" style="flex:1">End &amp; save today's session</button></div>

    <div class="grp">Privacy</div>
    <div><label>Keep text for</label>
      <select id="setExpire"><option value="1h">1 hour</option><option value="24h">24 hours</option><option value="7d">7 days</option><option value="keep">Keep</option></select></div>
    <div class="row"><button class="sav" id="saveSet" style="flex:1">Save settings</button>
      <button class="danger" id="wipeBtn" style="flex:1">Delete everything</button></div>

    <div class="grp">About</div>
    <div class="doc" data-doc="about">How it works</div>
    <div class="doc" data-doc="privacy">Privacy Policy</div>
    <div class="doc" data-doc="terms">Terms of Use</div>
    <div class="doc" data-doc="accessibility">Accessibility</div>
    <div class="doc" data-doc="licenses">Open-source licenses</div>
    <div class="doc" data-doc="faq">FAQ</div>

    <div class="ver" id="ver">Earshot</div>
  </div>

  <div id="docsheet">
    <div class="bar"><button class="gear" id="docBack">‹</button><span id="docTitle" style="color:var(--beige)"></span></div>
    <iframe id="docframe" title="doc"></iframe>
  </div>

  <div id="catchCard">
    <div class="cc-head"><span>Catch me up</span><button id="ccClose">✕</button></div>
    <div id="ccBody"><div class="sk"></div><div class="sk" style="width:70%"></div></div>
    <div class="cc-foot"><span id="ccSrc" class="muted"></span><button id="ccHear">Hear it</button></div>
  </div>

  <div id="resume"><p class="muted">Audio session stopped.</p><button id="resumeBtn">Tap to resume</button></div>

<script>
(function(){
  "use strict";
  var qs=new URLSearchParams(location.search), token=qs.get("t")||"", display="Earshot";
  var audio=null, ws=null, backoff=500, lastState="LISTENING", wakeLock=null, stick=true, muted=false;
  var appMode="ambient", srcLang="en", conv={their:"ar",mine:"en",turn:"them"};
  var lines=[];
  var HINTS={captions:"Every word, as it's said.", translate:"Two people, two languages.",
             ambient:"Stays quiet. Tells you when it matters."};

  var cfgReady=fetch("/config").then(r=>r.json()).then(c=>{ display=c.displayName; if(c.token)token=c.token;
    document.getElementById("brand-start").textContent=display; document.title=display; }).catch(()=>{});

  function $(id){ return document.getElementById(id); }
  function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  function show(id){ $("start").classList.toggle("on",id==="start"); $("main").classList.toggle("on",id==="main"); }

  // ---- captions ----
  var scroll=$("scroll"), stackEl=$("stack");
  function nearBottom(){ return scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<60; }
  scroll.addEventListener("scroll",function(){ stick=nearBottom(); $("jump").classList.toggle("on",!stick); });
  function toLive(){ scroll.scrollTop=scroll.scrollHeight; stick=true; $("jump").classList.remove("on"); }
  $("jump").onclick=toLive;
  function renderStack(){
    stackEl.innerHTML="";
    if(appMode==="ambient"){
      // calm screen: breathing mark + Listening + moments today + alert cards only
      var q=document.createElement("div"); q.id="empty";
      q.innerHTML='<div style="font-size:22px;color:var(--beige);margin-bottom:6px">Listening</div>'+
        '<div>I’ll tell you when something matters.</div>'+
        '<div style="margin-top:10px;color:var(--sage)">'+(window._moments||0)+' moments today</div>';
      stackEl.appendChild(q);
      lines.filter(function(l){return l._alert;}).slice(-20).forEach(function(ln){
        var a=document.createElement("div"); a.className="alertcard";
        a.innerHTML='<div class="why">⋄ '+esc(ln.reasons.map(function(r){return r.reason;}).join(" · "))+'</div><div class="primary" style="font-size:calc(var(--cap)*0.8)">'+esc(ln.text)+'</div>';
        stackEl.appendChild(a);
      });
      if(stick) toLive();
      return;
    }
    if(!lines.length){ var e=document.createElement("div"); e.id="empty"; e.textContent="Listening. Captions appear when someone speaks."; stackEl.appendChild(e); return; }
    lines.slice(-40).forEach(function(ln){
      if(ln._alert){ var a=document.createElement("div"); a.className="alertcard";
        a.innerHTML='<div class="why">⬥ '+esc(ln.reasons.map(function(r){return r.reason;}).join(" · "))+'</div><div class="primary" style="font-size:calc(var(--cap)*0.8)">'+esc(ln.text)+'</div>';
        stackEl.appendChild(a); return; }
      if(ln.divider){ var d=document.createElement("div"); d.className="divider"; d.textContent="— speaker changed —"; stackEl.appendChild(d); }
      var div=document.createElement("div");
      div.className="line "+(ln.speaker||"")+(ln.alert?" alert":"")+(ln.pending?" pending":"");
      var p=ln.primary||{}, s=ln.secondary||{};
      var whoTxt=ln.speaker?(ln.speaker==="me"?"You":"Them"):"";
      var who=whoTxt?'<div class="who">'+whoTxt+'</div>':"";
      var pr='<div class="primary"'+(p.rtl?' dir="rtl" lang="'+(p.lang||'')+'"':'')+'>'+esc(p.text)+'</div>';
      var se=s.text?'<div class="secondary"'+(s.rtl?' dir="rtl" lang="'+(s.lang||'')+'"':'')+'>'+esc(s.text)+'</div>':"";
      div.innerHTML=who+pr+se; stackEl.appendChild(div);
    });
    if(stick) toLive();
  }

  function setMeta(m){ if(!("mediaSession" in navigator))return;
    try{ navigator.mediaSession.metadata=new MediaMetadata({title:m.title||"",artist:m.artist||"",album:display,
      artwork:[{src:"/art/"+encodeURIComponent(m.state||lastState)+".png",sizes:"512x512",type:"image/png"}]});
      navigator.mediaSession.playbackState=(m.state==="MUTED")?"paused":"playing"; }catch(e){} }

  function onMsg(m){
    if(m.type==="auth"&&m.ok===false){ $("diag").textContent="⚠ "+(m.reason||"auth"); return; }
    if(m.type==="track"){ lastState=m.state||lastState; muted=(m.state==="MUTED"); setMeta(m);
      $("muteBtn").classList.toggle("on",muted); $("muteBtn").textContent=muted?"Paused — tap to resume":"Mute"; return; }
    if(m.type==="catchup"){ $("catchCard").classList.add("on"); fillCatch(m); return; }
    if(m.type==="appmode"){ appMode=m.app_mode; srcLang=m.src_lang||srcLang; syncControls(); return; }
    if(m.type==="conv"){ conv={their:m.their,mine:m.mine,turn:m.turn}; syncControls(); return; }
    if(m.type==="event"&&m.kind==="alert"){ window._moments=(window._moments||0)+1;
      lines.push({_alert:true,reasons:m.reasons||[{reason:m.detail}],text:m.detail}); trim(); renderStack(); return; }
    // Listen-for-me = quiet: no scrolling transcript, only alert cards.
    if(appMode==="ambient") return;
    if(m.type==="caption_update"){ for(var i=lines.length-1;i>=0;i--){ if(lines[i].id===m.id){
      lines[i].primary=m.primary; lines[i].secondary=m.secondary; lines[i].alert=m.alert; lines[i].pending=false; break; } } renderStack(); return; }
    if(m.type==="caption"){ if(!m.committed) return;  // partials not shown as lines (avoid flicker on phone)
      lines.push(m); trim(); renderStack(); return; }
  }
  function trim(){ if(lines.length>60) lines=lines.slice(-60); }

  function setConn(live){ /* dev-only; phone shows nothing */ }
  function connect(){ if(ws&&(ws.readyState===0||ws.readyState===1))return;
    var proto=location.protocol==="https:"?"wss":"ws";
    ws=new WebSocket(proto+"://"+location.host+"/ws/phone?t="+encodeURIComponent(token));
    ws.onopen=function(){ backoff=500; fetchState(); };
    ws.onmessage=function(e){ try{ onMsg(JSON.parse(e.data)); }catch(_){} };
    ws.onclose=function(){ setTimeout(connect,backoff); backoff=Math.min(backoff*2,8000); };
    ws.onerror=function(){ try{ws.close();}catch(_){} };
  }
  function startAudio(){ audio=new Audio("/silent.wav"); audio.loop=true;
    try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(_){}
    var p=audio.play(); if(p&&p.catch)p.catch(showResume); audio.onpause=showResume; }
  function showResume(){ $("resume").classList.add("on"); } function hideResume(){ $("resume").classList.remove("on"); }
  function wireMS(){ if(!("mediaSession" in navigator))return;
    navigator.mediaSession.setActionHandler("play",function(){ sendBtn(muted?"unmute":"catchup"); });
    navigator.mediaSession.setActionHandler("pause",function(){ sendBtn("mute"); });
    navigator.mediaSession.setActionHandler("previoustrack",function(){ sendBtn("catchup"); });
  }
  function sendBtn(a){ if(ws&&ws.readyState===1){ try{ ws.send(JSON.stringify({type:"button",action:a,source:"iphone",ts:Date.now()})); }catch(_){} } }
  function post(p,b){ return fetch(p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})}); }
  function wake(){ try{ if("wakeLock" in navigator) navigator.wakeLock.request("screen").then(function(w){wakeLock=w;}); }catch(_){} }

  // ---- controls ----
  function syncControls(){
    document.querySelectorAll("[data-mode]").forEach(function(b){ b.classList.toggle("on",b.dataset.mode===appMode); });
    $("hint").textContent=HINTS[appMode]||"";
    // hide the live caption-only chrome in Listen-for-me
    $("sizerow").style.display = (appMode==="ambient") ? "none" : "flex";
    renderLangRow();
    renderStack();
  }
  function renderLangRow(){
    var row=$("langrow"); row.innerHTML="";
    var LANGS=[["en","English"],["tl","Tagalog"],["ar","Arabic"]];
    function segRow(lbl, cur, pick){
      var l=document.createElement("div"); l.className="plabel"; l.textContent=lbl; row.appendChild(l);
      var seg=document.createElement("div"); seg.className="seg2";
      LANGS.forEach(function(p){ var b=document.createElement("button");
        b.className=(cur===p[0]?"on":""); b.textContent=p[1]; b.onclick=function(){ pick(p[0]); }; seg.appendChild(b); });
      row.appendChild(seg);
    }
    if(appMode==="translate"){
      segRow("They speak", conv.their, function(l){ post("/conv",{their:l}); conv.their=l; syncControls(); });
      segRow("I read", conv.mine, function(l){ post("/conv",{mine:l}); conv.mine=l; syncControls(); });
      // turn as its own toggle row
      var tl=document.createElement("div"); tl.className="plabel"; tl.textContent="Whose turn"; row.appendChild(tl);
      var seg=document.createElement("div"); seg.className="seg2";
      [["them","Their turn"],["me","My turn"]].forEach(function(p){ var b=document.createElement("button");
        b.className=(conv.turn===p[0]?"on":""); b.textContent=p[1];
        b.onclick=function(){ post("/conv",{turn:p[0]}); conv.turn=p[0]; syncControls(); }; seg.appendChild(b); });
      row.appendChild(seg);
    } else {
      segRow("Spoken", srcLang, function(l){ post("/appmode",{src_lang:l}); srcLang=l; syncControls(); });
    }
  }
  document.querySelectorAll("[data-mode]").forEach(function(b){ b.onclick=function(){ post("/appmode",{app_mode:b.dataset.mode}); appMode=b.dataset.mode; syncControls(); }; });
  function showCatchSkeleton(){ $("ccBody").innerHTML='<div class="sk"></div><div class="sk" style="width:70%"></div>';
    $("ccSrc").textContent=""; $("catchCard").classList.add("on"); }
  function fillCatch(m){ $("ccBody").innerHTML='<div>'+esc(m.line1||"")+'</div>'+(m.line2?'<div class="l2">'+esc(m.line2)+'</div>':"");
    $("ccSrc").textContent=(m.source==="llm"?("summary · "+(m.ms||"")+"ms"):"quick recap"); }
  $("catchBtn").onclick=function(){ showCatchSkeleton(); post("/catchup"); };
  $("ccClose").onclick=function(){ $("catchCard").classList.remove("on"); };
  $("ccHear").onclick=function(){ post("/catchup/say"); };
  $("muteBtn").onclick=function(){ post(muted?"/unmute":"/mute"); };
  // text size
  var _rafPend=false;
  function applySize(){ if(_rafPend)return; _rafPend=true; requestAnimationFrame(function(){ _rafPend=false;
    document.documentElement.style.setProperty("--cap", $("size").value+"px"); }); }
  $("size").addEventListener("input", applySize);               // instant, rAF, no re-render
  $("size").addEventListener("change", function(){ localStorage.setItem("capSize", $("size").value); });  // persist once
  var savedSize=localStorage.getItem("capSize"); if(savedSize!==null){ $("size").value=savedSize; } applySize();
  // settings sheet
  var kw=[];
  function renderKw(){ var el=$("kwChips"); el.innerHTML=kw.map(function(k,i){
    return '<span class="kwchip">'+esc(k)+' <b data-i="'+i+'">✕</b></span>'; }).join("");
    el.querySelectorAll("b").forEach(function(b){ b.onclick=function(){ kw.splice(+b.dataset.i,1); renderKw(); }; }); }
  $("kwAdd").addEventListener("keydown",function(e){ if(e.key==="Enter"){ var v=e.target.value.trim(); if(v){ kw.push(v); e.target.value=""; renderKw(); } e.preventDefault(); } });
  function loadSettings(){ fetch("/settings").then(r=>r.json()).then(function(s){
    $("setName").value=s.name||""; kw=(s.keywords||[]).slice(); renderKw(); $("setExpire").value=s.auto_expire||"24h"; }).catch(()=>{}); }
  function loadSessions(){ fetch("/sessions").then(r=>r.json()).then(function(j){
    $("sessList").innerHTML=(j.sessions||[]).length? j.sessions.map(function(s){
      return '<div class="doc" onclick="window.open(\'/session/ics?session='+encodeURIComponent(s.session)+'\')">'+esc(s.session)+'</div>'; }).join("")
      : '<div style="color:var(--moss)">No saved sessions yet.</div>'; }).catch(()=>{}); }
  $("gearBtn").onclick=function(){ loadSettings(); loadSessions(); $("ver").textContent="Earshot · "+appMode+" · local-only, 0 bytes to the internet"; $("sheet").classList.add("on"); };
  $("closeSheet").onclick=function(){ $("sheet").classList.remove("on"); };
  $("saveSet").onclick=function(){ post("/settings",{name:$("setName").value,keywords:kw,auto_expire:$("setExpire").value}).then(()=>{ $("closeSheet").click(); }); };
  $("endBtn").onclick=function(){ post("/session/end").then(loadSessions); };
  $("wipeBtn").onclick=function(){ if(confirm("Delete all stored text? This cannot be undone.")) post("/wipe"); };
  // in-app doc sheets (About rows -> /about /privacy ...)
  document.querySelectorAll(".doc[data-doc]").forEach(function(d){ d.onclick=function(){
    $("docframe").src="/"+d.dataset.doc; $("docTitle").textContent=d.textContent; $("docsheet").classList.add("on"); }; });
  $("docBack").onclick=function(){ $("docsheet").classList.remove("on"); $("docframe").src="about:blank"; };
  function fetchState(){ fetch("/conv").then(r=>r.json()).then(function(c){ conv={their:c.their,mine:c.mine,turn:c.turn};
    appMode=c.app_mode||appMode; srcLang=c.src_lang||srcLang; muted=!!c.muted; syncControls(); }).catch(()=>{}); }

  $("startBtn").addEventListener("click",function(){ startAudio(); wireMS(); wake(); show("main");
    cfgReady.then(function(){ connect(); syncControls(); },function(){ connect(); syncControls(); }); });
  $("resumeBtn").addEventListener("click",function(){ if(audio){var p=audio.play();if(p&&p.catch)p.catch(function(){});} wake(); hideResume(); });
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible"){
    if(audio&&audio.paused){var p=audio.play();if(p&&p.catch)p.catch(showResume);} wake(); if(!ws||ws.readyState>1)connect(); } });
})();
</script>
</body>
</html>
